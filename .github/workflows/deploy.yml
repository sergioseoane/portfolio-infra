      - name: Desplegar via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --region eu-south-2 \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "sudo -u ubuntu bash -c \"cd /home/ubuntu/portfolio/portfolio-infra && git pull origin main && RUNNING=\\$(docker compose ps --services --filter status=running) && docker compose up -d \\$RUNNING\""
            ]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --region eu-south-2 --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
          aws ssm get-command-invocation --region eu-south-2 --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"